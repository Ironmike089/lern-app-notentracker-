<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1310" />
    <meta name="description" content="Deine Noten. Sofort im Blick. Ein moderner Notentracker für deutsche weiterführende Schulen." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Notentracker</title>
    <script>
      // Applies the saved theme before first paint to avoid a flash of the
      // wrong theme. Mirrors the logic in src/utils/theme.ts, but must run
      // synchronously and inline (can't wait for the React bundle).
      (function () {
        try {
          var stored = localStorage.getItem('notentracker:theme')
          if (stored === 'dark' || stored === 'light') {
            document.documentElement.setAttribute('data-theme', stored)
          }
        } catch (e) {
          // localStorage unavailable (private mode etc.) — system theme applies via CSS.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
